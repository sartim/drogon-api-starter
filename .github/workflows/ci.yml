name: Build, test, and health check

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker builder image
        run: docker build --target build-env --tag user-service:ci-builder .

      - name: Build Docker runtime image
        run: docker build --tag user-service:ci .

      - name: Run unit tests
        run: docker run --rm user-service:ci-builder ctest --test-dir build --output-on-failure

      - name: Run user-service profile tests
        run: docker run --rm user-service:ci-builder ctest --test-dir build/user-service --output-on-failure

      - name: Build user-service runtime profile
        run: docker build --build-arg ENABLE_USER_SERVICE=ON --tag user-service:ci-user .

      - name: Start integration stack
        run: |
          docker tag user-service:ci-user user_service:latest
          SECRET_KEY=ci-test-secret \
            DB_NAME=ci-test \
            DB_USER=ci-test \
            DB_PASSWORD= \
            REDIS_ENABLED=true \
            docker compose up --detach --no-build

      - name: Seed integration user fixture
        run: |
          docker compose exec --no-TTY postgres \
            psql --set ON_ERROR_STOP=1 -U ci-test -d ci-test \
            < test/fixtures/integration_user.sql

      - name: Run integration smoke tests
        run: ./scripts/integration_smoke.sh

      - name: Stop integration stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Start service
        run: |
          docker run --detach --name user-service-ci --publish 8000:8000 \
            --env SECRET_KEY=ci-test-secret \
            --env DB_HOST=127.0.0.1 \
            --env DB_NAME=ci-test \
            --env DB_USER=ci-test \
            --env DB_PASSWORD= \
            user-service:ci

      - name: Wait for health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs user-service-ci
          exit 1

      - name: Verify API documentation endpoints
        run: |
          curl --fail --silent http://127.0.0.1:8000/openapi.yaml | grep --fixed-strings --quiet 'openapi: 3.0.3'
          curl --fail --silent --location http://127.0.0.1:8000/docs | grep --fixed-strings --quiet 'SwaggerUIBundle'

      - name: Verify observability metrics endpoint
        run: |
          curl --fail --silent http://127.0.0.1:8000/metrics | grep --fixed-strings --quiet 'http_requests_total'

      - name: Stop service
        if: always()
        run: docker rm --force user-service-ci || true
