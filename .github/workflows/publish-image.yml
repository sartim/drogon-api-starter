name: Publish versioned container image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  image_name: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Validate semantic version tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag in vX.Y.Z format, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Build image
        run: docker build --tag "${image_name}:${GITHUB_REF_NAME}" .

      - name: Run unit tests
        run: docker run --rm "${image_name}:${GITHUB_REF_NAME}" ctest --test-dir build --output-on-failure

      - name: Start service
        run: docker run --detach --name user-service-release --publish 8000:8000 "${image_name}:${GITHUB_REF_NAME}"

      - name: Verify health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs user-service-release
          exit 1

      - name: Stop service
        if: always()
        run: docker rm --force user-service-release || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable version tag
        run: docker push "${image_name}:${GITHUB_REF_NAME}"
