name: Publish versioned container image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to validate
        required: true
        type: string
      publish:
        description: Publish the validated image to GHCR
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  image_name: ghcr.io/${{ github.repository }}
  release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.release_tag }}

      - name: Validate semantic version tag
        run: |
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag in vX.Y.Z format, got ${release_tag}" >&2
            exit 1
          fi

      - name: Build image
        run: |
          docker build \
            --target build-env \
            --build-arg ENABLE_USER_SERVICE=ON \
            --tag "${image_name}:${release_tag}-builder" .
          docker build \
            --build-arg ENABLE_USER_SERVICE=ON \
            --tag "${image_name}:${release_tag}" .

      - name: Run unit tests
        run: docker run --rm "${image_name}:${release_tag}-builder" ctest --test-dir build --output-on-failure

      - name: Start service
        run: |
          docker run --detach --name user-service-release --publish 8000:8000 \
            --env SECRET_KEY=release-health-check-secret \
            --env DB_HOST=127.0.0.1 \
            --env DB_NAME=release-health-check \
            --env DB_USER=release-health-check \
            --env DB_PASSWORD= \
            --env REDIS_ENABLED=false \
            "${image_name}:${release_tag}"

      - name: Verify health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs user-service-release
          exit 1

      - name: Stop service
        if: always()
        run: docker rm --force user-service-release || true

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable version tag
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: docker push "${image_name}:${release_tag}"
